# ─────────────────────────────────────────────
#  Blush & Balloons — Nginx Reverse Proxy Config
#  File: nginx.conf
# ─────────────────────────────────────────────

server {
    listen 80;
    server_name blushandballons.roboshope.shop https.//blushandballons.roboshope.shop;

    # ── Redirect HTTP to HTTPS ──────────────────
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name  blushandballons.roboshope.shop https.//blushandballons.roboshope.shop;


    # ── SSL Certificates (free via Certbot) ─────
    ssl_certificate     /etc/letsencrypt/live/blushandballons.roboshope.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blushandballons.roboshope.shop/privkey.pem;

    # ── Security Headers ────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer-when-downgrade";

    # ── Gzip Compression ────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1000;

    # ── Static Files (served directly by Nginx) ─
    location /public/ {
        root /var/www/blush-and-balloons;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── API & Everything Else → Node.js ─────────
    location / {
        proxy_pass         http://blushandballons.roboshope.shop:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Max Upload Size (for photos etc.) ───────
    client_max_body_size 10M;
}